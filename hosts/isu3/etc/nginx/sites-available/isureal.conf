# Issue #16 / Clarification #20: america の書き込み系 API を、DB に近い asia1 の america 用アプリ（:8082）へ転送する。
# 転送はルーター経由（遅延・帯域制限はそのまま）で、X-Country-Code の振り分けは変えない。
upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

upstream isureal_asia {
  server 192.168.1.10:8082;
  # リージョン間の TCP ハンドシェイク（約100ms）を毎回払わないよう、接続を使い回す
  keepalive 64;
}

# 段階1：GET/HEAD（SSE を含む）はローカル、それ以外（書き込み系）は asia へ。
# 段階2で GET も寄せるときは、GET/HEAD の行を isureal_asia にし、/api/notifications だけローカルに残す。
map $request_method $isureal_upstream {
  GET     isureal_local;
  HEAD    isureal_local;
  default isureal_asia;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://$isureal_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
}
