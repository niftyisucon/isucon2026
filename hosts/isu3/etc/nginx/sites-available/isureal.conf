# Issue #16 / Clarification #20: america の API（通知の SSE を除く）を、DB に近い asia1 の america 用アプリ（:8082）へ転送する。
# 転送はルーター経由（遅延・帯域制限はそのまま）で、X-Country-Code の振り分けは変えない。
upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

upstream isureal_asia {
  server 192.168.1.10:8082;
  # リージョン間の TCP ハンドシェイク（約100ms）を毎回払わないよう、接続を使い回す
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 段階2：/api/ はすべて asia へ。段階1に戻すときは、ここを「GET/HEAD はローカル、それ以外は asia」の map に戻す。
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isureal_asia;
  }

  # 通知の SSE は接続を張り続けるので、リージョン間の接続を占有しないようローカルのアプリで受ける。
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isureal_local;
  }

  location / {
    try_files $uri /index.html;
  }
}
