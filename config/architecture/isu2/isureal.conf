# All API traffic enters the local edge app. It proxies stateful requests to
# asia1's private IP through the existing constrained route, never router IPs.
upstream isureal_edge {
  server 127.0.0.1:8080;
  keepalive 64;
}
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isureal_edge;
  }
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_edge;
  }
  location / { try_files $uri /index.html; }
}
