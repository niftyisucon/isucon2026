[Service]
# Optional experiment for the shared isureal-go process only, via Muse's deployment.
# Not automatically applied. Total 27 leaves 3 connections in the default pool30.
# Clear the uniform override: nonempty settings cannot be combined.
Environment=ISUREAL_CORE_ADMISSION=true
Environment=ISUREAL_CORE_REGION_CONCURRENCY=
Environment=ISUREAL_CORE_REGION_LIMITS=asia:5,europe:11,america:11
