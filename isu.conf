# isu.conf: チームで共有する設定（bash として source される）。
# 接続情報（IP・鍵）は書かない。各自の .local/ssh_config に Host <名前> として書く。
# `isu discover` の結果（hosts/<host>/discovery.md）を見ながら埋める。
# ChangeMe の箇所は大会当日に必ず埋める。例は ISUCON14（isuride、Go）のもの。

# ---- ホスト ----
# 名前は .local/ssh_config の Host と一致させる。属性は <名前>_<属性>。
ISU_HOSTS=(isu1 isu2 isu3)
isu1_owner=member1          # 持ち主（各自の ISU_ME）。他人のホストへの deploy は -f なしでは止まる
isu1_roles="nginx app db"   # nginx / app / db
isu1_private_ip=ChangeMe
isu2_owner=member2
isu2_roles="nginx app db"
isu2_private_ip=ChangeMe
isu3_owner=member3
isu3_roles="nginx app db"
isu3_private_ip=ChangeMe

ISU_PROD_HOST=isu1          # 本番計測ホスト。main の clean な状態からしか deploy できない

# ---- 管理対象ファイル（サーバーの絶対パス → hosts/<host>/<絶対パス>）----
ISU_HOST_FILES=(
  /etc/nginx
  /etc/mysql
  /etc/systemd/system/ChangeMe.service   # 例: /etc/systemd/system/isuride-go.service
  /home/isucon/env.sh
)
# 取り込み・反映の両方で除外する（秘密鍵など）。除外したものはサーバー側で消されない。
ISU_SYNC_EXCLUDES=('*.key' 'debian.cnf' 'modules-enabled/*')

# ---- アプリ ----
ISU_WEBAPP_REMOTE=/home/isucon/webapp
ISU_APP_USER=isucon
ISU_APP_SERVICES="ChangeMe"  # env ファイルを読むサービスは全部入れる（deploy で env が変わったときに再起動する対象）。例: "isuride-go isuride-matcher"
ISU_DB_SERVICE=mysql         # mysql / mariadb
# 使わない言語実装や巨大な生成物。取り込み・反映の対象外（サーバー側にはそのまま残る）。
ISU_WEBAPP_EXCLUDES=(nodejs perl php python ruby rust 'node_modules' 'target')
# 取り込みだけ除外（ビルド成果物など、反映はする）。例: (go/isuride)
ISU_WEBAPP_PULL_EXCLUDES=()
# 例: 'cd webapp/go && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o isuride .'
ISU_BUILD_CMD=''

