# isu.conf: チームで共有する設定（bash として source される）。
# 接続情報（IP・鍵）は書かない。各自の .local/ssh_config に Host <名前> として書く。
# `isu discover` の結果（hosts/<host>/discovery.md）を見ながら埋める。
# ISUCON2026: asia1 / europe1 / america1 / asia2。ルーターは操作対象外。

# ---- ホスト ----
# 名前は .local/ssh_config の Host と一致させる。属性は <名前>_<属性>。
ISU_HOSTS=(isu1 isu2 isu3 isu4)
# owner は担当決定後に各自の ISU_ME へ変更。未割当の間は通常の deploy/restart を止める。
isu1_owner=unassigned
isu1_roles="nginx app"      # asia1
isu1_private_ip=192.168.1.10
isu2_owner=unassigned
isu2_roles="nginx app"      # europe1
isu2_private_ip=192.168.2.10
isu3_owner=unassigned
isu3_roles="nginx app"      # america1
isu3_private_ip=192.168.3.10
isu4_owner=unassigned
isu4_roles="db"             # asia2。SSH の isu-db と同じ接続先。
isu4_private_ip=192.168.4.10

ISU_PROD_HOST=isu1          # 本番計測ホスト。main の clean な状態からしか deploy できない

# ---- 管理対象ファイル（サーバーの絶対パス → hosts/<host>/<絶対パス>）----
ISU_HOST_FILES=(
  /etc/nginx
  /etc/postgresql
  /etc/systemd/system/isureal-go.service
  /etc/systemd/system/isureal-go.service.d/30-isucon-tracing.conf
  /etc/systemd/system/isureal-guard.service
  /home/isucon/env.sh
)
# 取り込み・反映の両方で除外する（秘密鍵など）。除外したものはサーバー側で消されない。
ISU_SYNC_EXCLUDES=('*.key' 'debian.cnf' 'modules-enabled/*' '._*')

# ---- アプリ ----
ISU_WEBAPP_REMOTE=/home/isucon/webapp
ISU_APP_USER=isucon
ISU_APP_SERVICES="isureal-go isureal-guard"
ISU_DB_SERVICE=postgresql@16-main
ISU_DB_NAME=isureal          # discover の実スキーマ・テーブル統計取得先
ISU_PG_LOG_PATH=/var/log/postgresql/postgresql-16-main.log
# pgBadger はローカル .local/tools/ に導入。公式 v13.2 のコミットとSHA256を固定。
ISU_PGBADGER_VERSION=13.2
ISU_PGBADGER_COMMIT=4fb2ba0d2bb176c087e25224b4da337dcae0cca7
ISU_PGBADGER_SHA256=ef8fe2c9ea3181d7eefa31ec46a6979b085b1ced9a8068f9e5fef334eb19ae41
# 使わない言語実装や巨大な生成物。取り込み・反映の対象外（サーバー側にはそのまま残る）。
ISU_WEBAPP_EXCLUDES=(nodejs perl php python ruby rust 'node_modules' 'target' '._*')
# 取り込みだけ除外（ビルド成果物など、反映はする）。例: (go/isuride)
ISU_WEBAPP_PULL_EXCLUDES=(go/isureal)
# 例: 'cd webapp/go && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o isuride .'
ISU_BUILD_CMD='cd webapp/go && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o isureal cmd/isureal/main.go'

# Splunk: 専用コマンドで人間が導入。通常の setup/deploy では変更しない。
ISU_SPLUNK_OTEL_VERSION=0.164.0
ISU_SPLUNK_OTEL_SHA256=e1198466e4b2d2c4a316bbf8367c4c77bc306d661d98185750dfdb64985f282e

